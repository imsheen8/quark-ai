    <header class="topbar">
      <button class="icon-btn" id="toggleSidebar" aria-label="القائمة"><svg class="i"><use href="#i-menu"/></svg></button>
      <h1 id="chatTitle"></h1>
      <button class="icon-btn" id="topIncog" aria-label="محادثة خفية" title="محادثة خفية" aria-pressed="false"><svg class="i"><use href="#i-ghost"/></svg></button>
      <button class="icon-btn" id="topSearch" aria-label="بحث في المحادثة" title="بحث في المحادثة"><svg class="i"><use href="#i-search"/></svg></button>
      <button class="icon-btn" id="topNew" aria-label="محادثة جديدة"><svg class="i"><use href="#i-message-plus"/></svg></button>
      <button class="icon-btn" id="topMore" aria-label="المزيد"><svg class="i"><use href="#i-more"/></svg></button>
    </header>
    <div class="csearch" id="csearch" hidden>
      <svg class="i cs-i"><use href="#i-search"/></svg>
      <input id="csQ" type="text" placeholder="بحث في المحادثة…" autocomplete="off" spellcheck="false" enterkeyhint="search">
      <span class="cs-cnt" id="csCnt"></span>
      <button type="button" class="cs-b up" id="csPrev" aria-label="النتيجة السابقة"><svg class="i"><use href="#i-chevron-down"/></svg></button>
      <button type="button" class="cs-b" id="csNext" aria-label="النتيجة التالية"><svg class="i"><use href="#i-chevron-down"/></svg></button>
      <button type="button" class="cs-b" id="csClose" aria-label="إغلاق البحث"><svg class="i"><use href="#i-x"/></svg></button>
    </div>
