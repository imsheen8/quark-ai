<div class="plan-ov" id="planOv" role="dialog" aria-modal="true" aria-label="الاشتراك" hidden>
  <div class="plan-in">
    <button type="button" class="plan-x" id="planX" aria-label="إغلاق"><svg class="i"><use href="#i-x"/></svg></button>
    <h1>احصل على المزيد</h1>
    <p class="plan-sub">اختر الخطة المناسبة لك</p>
    <div class="plan-reason" id="planReason" hidden></div>
    <div class="plan-status" id="planStatus" hidden></div>

    <div class="plan-cards" id="planCards"></div>

    <div class="plan-card plan-redeem">
      <h2 id="planCodeTitle">لديك كود؟</h2>
      <p class="plan-desc">كود اشتراك، أو كود إحالة من صديق، أو كود ترويجي يمنحك أيامًا مجانية.</p>
      <label class="plan-lbl" for="planCode" id="planCodeLbl">الكود</label>
      <input class="plan-code" id="planCode" type="text" inputmode="text" maxlength="17" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" dir="ltr">
      <button type="button" class="plan-go" id="planGo" disabled>تفعيل الكود</button>
      <div class="plan-msg" id="planMsg" role="status"></div>
      <button type="button" class="plan-link" id="planRemove" hidden>إزالة الاشتراك من هذا الجهاز</button>
    </div>

    <div class="plan-card plan-ref" id="planRef">
      <h2>ادعُ أصدقاءك واربحوا معًا</h2>
      <p class="plan-desc" id="planRefDesc"></p>
      <div class="ref-box" id="planRefBox" hidden>
        <span class="ref-lbl">كود الإحالة الخاص بك</span>
        <b class="ref-code" id="planRefCode" dir="ltr"></b>
        <div class="ref-acts">
          <button type="button" class="ref-btn" id="planRefCopy"><svg class="i"><use href="#i-copy"/></svg><span>نسخ الكود</span></button>
          <button type="button" class="ref-btn prim" id="planRefShare"><svg class="i"><use href="#i-share"/></svg><span>مشاركة</span></button>
        </div>
        <div class="ref-stats" id="planRefStats"></div>
      </div>
      <div class="plan-msg" id="planRefMsg" role="status"></div>
    </div>
    <p class="plan-note">أكواد الاشتراك يحصل عليها المستخدم من مزوّد التطبيق. الكود من 8 رموز (أرقام وحروف).</p>
  </div>
</div>
